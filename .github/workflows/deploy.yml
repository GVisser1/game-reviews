name: Deploy to PROD
run-name: Deploy ${{ github.ref_name }} to PROD

# Production deploys are manual: start this from the Actions tab ("Run workflow") and pick any branch to deploy.
on:
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at once; a second one waits for the first.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Variables and secrets below come from the "production" environment in the repository settings.
    environment:
      name: production
      url: https://game-reviews-ccu.pages.dev
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      # pnpm has to be installed before setup-node so setup-node can cache the pnpm store.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check the production settings are set
        run: |
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_TURNSTILE_SITE_KEY SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing variable $name in the production environment"
              exit 1
            fi
          done

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Format, lint and type check
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

      - name: Build
        run: pnpm build:pages

      # The database and edge functions go out before the app that relies on them. Pushing fails if production has a
      # migration this branch doesn't, which stops an old branch from being deployed over a newer database.
      - name: Push database migrations
        run: |
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
          pnpm exec supabase db push --linked --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy edge functions
        run: pnpm exec supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy to Cloudflare Pages
        # --branch=main is Cloudflare's production slot, so whichever git branch this runs on becomes the live site.
        run: >-
          pnpm exec wrangler pages deploy dist/client --project-name=game-reviews --branch=main
          --commit-hash="$GITHUB_SHA" --commit-message="Deployed from $GITHUB_REF_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
