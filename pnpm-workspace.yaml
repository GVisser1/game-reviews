# Point every package that imports `vite` or `vitest` at Vite+'s own copies, as Vite+'s docs require
# Two Vite copies can break runtime identity checks, like the TanStack Start 404s in https://github.com/voidzero-dev/vite-plus/issues/1391.
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.3.0 # Match the installed vite-plus version
  vitest@*: 5.0.5 # Match the version from `vp toolchain vitest`

# Install scripts pnpm should skip. Both get their binaries from platform-specific packages instead.
allowBuilds:
  esbuild: false
  workerd: false
